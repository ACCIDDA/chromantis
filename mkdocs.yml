site_name: Chromantis
site_url: https://accidda.github.io/chromantis/
repo_url: https://github.com/ACCIDDA/chromantis
site_description: Probabilistic epidemic nowcasting and forecasting
docs_dir: docs

extra_css:
  - stylesheets/chromantis.css

extra_javascript:
  - javascripts/explorer-link.js

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - scripts/docs_hooks.py

nav:
  - Introduction: index.md
  - What we learned: findings.md
  - Architecture: architecture.md
  - Challenges:
      - Overview: challenges/index.md
      - FluSight weekly: challenges/flusight-weekly.md
      - FluSight season peak: challenges/flusight-peak.md
      - RSV: challenges/rsv.md
      - Flu MetroCast: challenges/metrocast.md
      - COVID-19: challenges/covid.md
      - BDBV (Ebola): challenges/ebola.md
      - Weekly data pulls: challenges/weekly-inputs.md
      - Respiratory hub rules: reference/hub-scoring-2026-2027.md
  - Experiments:
      - Model runs: experiments/index.md
  - Data:
      - Overview: data/index.md
      - Interactive staircase: data/staircase.md
      - Revision explorer: data/revision-staircase.md
      - Sources: data/sources.md
      - Selection and provenance: data/methods.md
      - Panel diagnostics: data/panel.md
      - Explorer: explorer/overview.md
      - Explorer filters: explorer/filters.md
  - Workflow:
      - From question to submission: reusable-research-workflow.md
      - Run a study: workflow.md
      - Define a dataset and problem: multipathogen-pipeline.md
      - Read a configuration (choices A–F): reference/model-choices.md
  - Software:
      - Code layout and development: development.md
      - Setup: setup.md
      - Commands: reference/cli.md
      - Scenario fields: reference/scenario.md
      - Python API: reference/python-api.md
      - Explorer API: explorer/api.md
  - Background:
      - Other models: reference/other-models.md
      - FluSight model review: reference/flusight-2025-2026-model-review.md
      - Historical nowcast comparator: reference/baselinenowcast.md
